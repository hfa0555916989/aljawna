# تحديثات الاعتماديات أسبوعيًا (docs/DECISIONS.md). كل تحديث يمرّ بـ CI في PR مستقل،
# ولا يُدمج آليًا: يراجعه المسؤول عن الدعم الفني قبل الدمج.
version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          day: sunday
          time: '06:00'
          timezone: Asia/Riyadh
      open-pull-requests-limit: 5
      labels:
          - dependencies
      groups:
          composer-minor-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: sunday
          time: '06:00'
          timezone: Asia/Riyadh
      open-pull-requests-limit: 5
      labels:
          - dependencies
      groups:
          npm-minor-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: sunday
          time: '06:00'
          timezone: Asia/Riyadh
      labels:
          - dependencies
