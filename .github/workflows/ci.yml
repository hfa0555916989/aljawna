name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    quality:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: ajawna_testing
                    POSTGRES_USER: ajawna
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U ajawna"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: ajawna_testing
            DB_USERNAME: ajawna
            DB_PASSWORD: secret
            REDIS_HOST: 127.0.0.1
            REDIS_PORT: 6379
            APP_ENV: testing
            APP_LOCALE: ar
            APP_FALLBACK_LOCALE: ar
            APP_TIMEZONE: Asia/Riyadh

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pgsql, redis, intl, mbstring, gd, exif, fileinfo
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Copy .env
              run: cp .env.example .env

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v3
              with:
                  composer-options: '--no-interaction --no-progress'

            - name: Generate app key
              run: php artisan key:generate --ansi

            - name: Install npm dependencies
              run: npm ci

            - name: Build frontend assets
              run: npm run build

            - name: Lint (Pint)
              run: composer lint

            - name: Static analysis (Larastan)
              run: composer analyse

            - name: Run tests (Pest)
              run: composer test
