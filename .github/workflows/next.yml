name: Next.js

on:
    pull_request:
        paths:
            - 'next/**'
            - '.github/workflows/next.yml'
    push:
        branches: [main]
        paths:
            - 'next/**'
            - '.github/workflows/next.yml'

defaults:
    run:
        working-directory: next

jobs:
    quality:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: ajawna_next_test
                    POSTGRES_USER: ajawna
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U ajawna"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        env:
            TEST_DATABASE_URL: postgres://ajawna:secret@127.0.0.1:5432/ajawna_next_test
            DATABASE_URL: postgres://ajawna:secret@127.0.0.1:5432/ajawna_next_test

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: next/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint (ESLint)
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Tests (Vitest)
              run: npm test

            - name: Build
              run: npm run build
